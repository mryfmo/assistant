openapi: 3.1.0
info:
  title: Orchestrator Control Plane API
  version: 0.1.0
paths:
  /v1/workflows:
    post:
      summary: Create workflow from user intent
      responses:
        "202":
          description: accepted
  /v1/workflows/{workflowId}/approve:
    post:
      summary: Approve promotion or execution gate
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: approved
  /v1/workflows/{workflowId}/cancel:
    post:
      summary: Cancel workflow
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: cancelled
